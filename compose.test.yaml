name: erbauer-tests

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: erbauer_test_control
      POSTGRES_USER: erbauer_test
      POSTGRES_PASSWORD: erbauer_test_only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erbauer_test -d erbauer_test_control"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
