{% load crispy_forms_field i18n %}

<div id="div_{{ field.auto_id }}" class="mb-3 auth-form__field">
  <div class="password-field-wrap">
    {% crispy_field field 'class' 'form-control auth-form__control auth-form__control--password' %}

    <button
      type="button"
      class="password-toggle"
      data-target="{{ field.auto_id }}"
      aria-label="{% trans 'Show password' %}"
      aria-pressed="false"
    >
      <span class="password-toggle__icon password-toggle__icon--show" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M2 12C3.9 8.4 7.5 6 12 6C16.5 6 20.1 8.4 22 12C20.1 15.6 16.5 18 12 18C7.5 18 3.9 15.6 2 12Z"/>
          <circle cx="12" cy="12" r="3.2"/>
        </svg>
      </span>

      <span class="password-toggle__icon password-toggle__icon--hide" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 3L21 21"/>
          <path d="M10.6 6.2C11.1 6.1 11.5 6 12 6C16.5 6 20.1 8.4 22 12C21.1 13.7 19.8 15.1 18.3 16.2"/>
          <path d="M6.2 6.7C4.5 7.9 3.1 9.7 2 12C3.9 15.6 7.5 18 12 18C13.9 18 15.6 17.6 17.1 16.8"/>
          <path d="M14.1 14.3C13.6 14.8 12.8 15.2 12 15.2C10.2 15.2 8.8 13.8 8.8 12C8.8 11.2 9.1 10.5 9.7 9.9"/>
        </svg>
      </span>
    </button>
  </div>

  {% if field.name == "password1" or field.name == "new_password1" %}
    <div id="password-strength-wrapper" class="password-strength password-strength-hidden mt-2">
      <div class="progress">
        <div id="password-strength-bar" class="progress-bar"></div>
      </div>
    </div>
  {% endif %}
</div>
