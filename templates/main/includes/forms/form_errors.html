{% load i18n %}

{% if form.service_message %}
  <p class="error-message">{{ form.service_message }}</p>
{% else %}
{% for field in form %}
{% if field.errors %}
<div class="form-errors">
  {% for error in field.errors %}
  <p class="error-message">{{ error }}</p>
  {% endfor %}
</div>
{% endif %}
{% endfor %}
{% endif %}
