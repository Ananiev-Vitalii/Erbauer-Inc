{% load i18n static %}
<!DOCTYPE html>
<html lang="{{ language }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% trans "Service temporarily unavailable" %}</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/core/errors.css' %}">
</head>
<body>
  <main class="error-page">
    <div class="error-page__container">
      <p class="error-page__code">503</p>
      <h1 class="error-page__title">
        {% trans "Service temporarily unavailable" %}
      </h1>
      <p class="error-page__description" role="alert">{{ message }}</p>
      <a href="{% url 'main:home' %}" class="error-page__button">
        {% trans "Return to homepage" %}
      </a>
    </div>
  </main>
</body>
</html>
